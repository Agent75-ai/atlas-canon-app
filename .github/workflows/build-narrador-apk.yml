name: Build Narrador Offline Kokoro APK

on:
  push:
    branches: ["temp-narrador-apk"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Recreate source project
        run: |
          cat narrador-parts/*.b64 > narrador-source.full.b64
          test "$(wc -c < narrador-source.full.b64)" -eq 31616
          base64 -d narrador-source.full.b64 > NarradorOffline_MotoG75_source.zip
          unzip -q NarradorOffline_MotoG75_source.zip

      - name: Apply Kokoro audiobook sources
        run: |
          cat embedded-patch/kokoro21/*.b64 > /tmp/kokoro21.b64
          test "$(wc -c < /tmp/kokoro21.b64)" -eq 14680
          test "$(sha256sum /tmp/kokoro21.b64 | cut -d' ' -f1)" = "895c9ef5e3be24cd0e11e8b8ace5454f5fa93d8480a0fffc1a78d1112dd9046d"
          base64 -d /tmp/kokoro21.b64 > /tmp/kokoro21.tar.gz
          test "$(sha256sum /tmp/kokoro21.tar.gz | cut -d' ' -f1)" = "c22f0ddf1f97b313868e29f6c419789b6b32d7757c34887504a798f2753d5789"
          tar -xzf /tmp/kokoro21.tar.gz -C NarradorOffline
          grep -q 'OfflineTtsKokoroModelConfig' NarradorOffline/app/src/main/java/com/gregorio/narradoroffline/NarrationService.java
          grep -q 'SPEAKER_ID = 29' NarradorOffline/app/src/main/java/com/gregorio/narradoroffline/NarrationService.java
          grep -q 'kokoro.setLang("es")' NarradorOffline/app/src/main/java/com/gregorio/narradoroffline/NarrationService.java
          grep -q 'TARGET_BLOCK = 1050' NarradorOffline/app/src/main/java/com/gregorio/narradoroffline/MarkdownUtils.java

          python3 - <<'PY'
          from pathlib import Path
          p=Path('NarradorOffline/settings.gradle')
          s=p.read_text().replace('mavenCentral()\n    }', "mavenCentral()\n        maven { url 'https://jitpack.io' }\n    }")
          p.write_text(s)

          p=Path('NarradorOffline/app/build.gradle')
          s=p.read_text()
          s=s.replace('versionCode 1', 'versionCode 7')
          s=s.replace("versionName '1.0.0'", "versionName '2.1.0-kokoro'")
          s=s.replace('targetSdk 35\n', "targetSdk 35\n        ndk { abiFilters 'arm64-v8a' }\n")
          s += "\n\ndependencies {\n    implementation 'com.github.k2-fsa:sherpa-onnx:v1.13.4'\n    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.7.20'\n}\n"
          p.write_text(s)
          PY

      - name: Embed Kokoro multilingual voice model
        run: |
          curl -L --fail --retry 4 --retry-delay 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2 -o /tmp/kokoro.tar.bz2
          mkdir -p /tmp/kokoro
          tar -xjf /tmp/kokoro.tar.bz2 -C /tmp/kokoro
          MODEL_DIR=$(find /tmp/kokoro -maxdepth 1 -type d -name 'kokoro-multi-lang-v1_0*' | head -1)
          test -n "$MODEL_DIR"
          test -f "$MODEL_DIR/model.onnx"
          test -f "$MODEL_DIR/voices.bin"
          test -f "$MODEL_DIR/tokens.txt"
          test -d "$MODEL_DIR/espeak-ng-data"
          mkdir -p NarradorOffline/app/src/main/assets/tts-kokoro
          cp -a "$MODEL_DIR"/. NarradorOffline/app/src/main/assets/tts-kokoro/
          du -sh NarradorOffline/app/src/main/assets/tts-kokoro

      - name: Build APK
        working-directory: NarradorOffline
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Inspect APK
        run: |
          APK=NarradorOffline/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -E 'assets/tts-kokoro/model.onnx|assets/tts-kokoro/voices.bin|assets/tts-kokoro/espeak-ng-data|lib/arm64-v8a/libsherpa-onnx-jni.so|lib/arm64-v8a/libonnxruntime.so'
          found=0
          for dex in $(unzip -Z1 "$APK" | grep '^classes.*\.dex$'); do
            if unzip -p "$APK" "$dex" | strings | grep -q 'kotlin/jvm/internal/Intrinsics'; then found=1; break; fi
          done
          test "$found" -eq 1
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NarradorOffline-MotoG75-2.1.0-Kokoro-Alex-APK
          path: NarradorOffline/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
