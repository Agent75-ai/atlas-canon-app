name: Build Narrador Offline Neural APK

on:
  push:
    branches: ["temp-narrador-apk"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Recreate source project
        run: |
          cat narrador-parts/*.b64 > narrador-source.full.b64
          test "$(wc -c < narrador-source.full.b64)" -eq 31616
          base64 -d narrador-source.full.b64 > NarradorOffline_MotoG75_source.zip
          unzip -q NarradorOffline_MotoG75_source.zip

      - name: Apply neural voice, playback and Kotlin runtime fixes
        run: |
          cat embedded-patch/pcm16/*.b64 > /tmp/narration-service.gz.b64
          test "$(wc -c < /tmp/narration-service.gz.b64)" -eq 7476
          base64 -d /tmp/narration-service.gz.b64 | gzip -d > NarradorOffline/app/src/main/java/com/gregorio/narradoroffline/NarrationService.java
          test -s NarradorOffline/app/src/main/java/com/gregorio/narradoroffline/NarrationService.java

          base64 -d embedded-patch/MainActivity.fixed.gz.b64 | gzip -d > NarradorOffline/app/src/main/java/com/gregorio/narradoroffline/MainActivity.java
          test -s NarradorOffline/app/src/main/java/com/gregorio/narradoroffline/MainActivity.java

          python3 - <<'PY'
          from pathlib import Path
          p=Path('NarradorOffline/settings.gradle')
          s=p.read_text().replace('mavenCentral()\n    }', "mavenCentral()\n        maven { url 'https://jitpack.io' }\n    }")
          p.write_text(s)

          p=Path('NarradorOffline/app/build.gradle')
          s=p.read_text()
          s=s.replace('versionCode 1', 'versionCode 5')
          s=s.replace("versionName '1.0.0'", "versionName '2.0.3-neural'")
          s=s.replace('targetSdk 35\n', "targetSdk 35\n        ndk { abiFilters 'arm64-v8a' }\n")
          s += "\n\ndependencies {\n    implementation 'com.github.k2-fsa:sherpa-onnx:v1.13.4'\n    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.7.20'\n}\n"
          p.write_text(s)

          p=Path('NarradorOffline/app/src/main/res/layout/activity_main.xml')
          s=p.read_text()
          s=s.replace('Perfil recomendado: Piper es_MX-claude-high. Voz masculina latina, calidad alta.', 'Voz integrada: Aldo · español latino es-419 · neural · offline.')
          s=s.replace('android:id="@+id/btnVoxSherpa"', 'android:id="@+id/btnVoxSherpa"\n                    android:visibility="gone"')
          s=s.replace('android:id="@+id/btnTtsSettings"', 'android:id="@+id/btnTtsSettings"\n                android:visibility="gone"')
          p.write_text(s)
          PY

      - name: Embed Aldo neural voice
        run: |
          curl -L --fail --retry 4 --retry-delay 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_MX-ald-medium.tar.bz2 -o /tmp/aldo.tar.bz2
          mkdir -p /tmp/aldo
          tar -xjf /tmp/aldo.tar.bz2 -C /tmp/aldo
          MODEL_DIR=$(find /tmp/aldo -maxdepth 1 -type d -name 'vits-piper-es_MX-ald-medium*' | head -1)
          test -n "$MODEL_DIR"
          mkdir -p NarradorOffline/app/src/main/assets/tts
          cp -a "$MODEL_DIR"/. NarradorOffline/app/src/main/assets/tts/

      - name: Build APK
        working-directory: NarradorOffline
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Inspect APK
        run: |
          APK=NarradorOffline/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -E 'assets/tts/es_MX-ald-medium.onnx|lib/arm64-v8a/libsherpa-onnx-jni.so|lib/arm64-v8a/libonnxruntime.so'
          found=0
          for dex in $(unzip -Z1 "$APK" | grep '^classes.*\.dex$'); do
            if unzip -p "$APK" "$dex" | strings | grep -q 'kotlin/jvm/internal/Intrinsics'; then
              found=1
              break
            fi
          done
          test "$found" -eq 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NarradorOffline-MotoG75-Neural-2.0.3-KotlinFix-APK
          path: NarradorOffline/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
