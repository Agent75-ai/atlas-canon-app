name: Build Narrador Offline APK

on:
  push:
    branches: ["temp-narrador-apk"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Recreate source
        run: |
          base64 -d narrador-source.b64 > NarradorOffline_MotoG75_source.zip
          unzip -q NarradorOffline_MotoG75_source.zip

      - name: Build debug APK
        working-directory: NarradorOffline
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NarradorOffline-MotoG75-APK
          path: NarradorOffline/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
