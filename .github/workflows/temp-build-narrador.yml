name: Temporary Narrador APK Build

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'temp-narrador-apk'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Recreate Android project
        run: |
          cat narrador-parts/*.b64 > narrador-source.full.b64
          test "$(wc -c < narrador-source.full.b64)" -eq 31616
          base64 -d narrador-source.full.b64 > NarradorOffline_MotoG75_source.zip
          echo "ca5301888045295185196093604163525d7f0781cfdbf441c5413122dc015fc1  NarradorOffline_MotoG75_source.zip" | sha256sum -c -
          unzip -q NarradorOffline_MotoG75_source.zip

      - name: Build APK
        working-directory: NarradorOffline
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NarradorOffline-MotoG75-APK
          path: NarradorOffline/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
