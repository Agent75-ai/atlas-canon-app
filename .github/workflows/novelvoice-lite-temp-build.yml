name: NovelVoice 0.6.1 Lite temporary build

on:
  push:
    branches:
      - tmp/novelvoice-0.6.1-lite
    paths:
      - '.github/workflows/novelvoice-lite-temp-build.yml'
      - 'tmp_build_nv061/source.part*'
      - 'tmp_build_nv061/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat tmp_build_nv061/source.part* > /tmp/novelvoice-lite.b64
          base64 -d /tmp/novelvoice-lite.b64 > /tmp/NovelVoiceAndroid_v0.6.1-lite-source.zip
          echo "fb507a0491305da2d4bb8315c5a81b3c30202335fe2342ac4ce1d2eb9173aa19  /tmp/NovelVoiceAndroid_v0.6.1-lite-source.zip" | sha256sum -c -
          mkdir -p /tmp/novelvoice-lite-src
          unzip -q /tmp/NovelVoiceAndroid_v0.6.1-lite-source.zip -d /tmp/novelvoice-lite-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Aldo and CarlFM Piper voices
        working-directory: /tmp/novelvoice-lite-src/NovelVoiceAndroid_v0.6.0
        run: |
          chmod +x prepare_piper.sh
          ./prepare_piper.sh
          du -sh app/src/main/assets/* || true

      - name: Test and build APK
        working-directory: /tmp/novelvoice-lite-src/NovelVoiceAndroid_v0.6.0
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --stacktrace
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/NovelVoice-0.6.1-Lite-Aldo-CarlFM.apk
          SIZE=$(stat -c%s /tmp/NovelVoice-0.6.1-Lite-Aldo-CarlFM.apk)
          echo "APK size: $SIZE"
          test "$SIZE" -lt 100000000
          sha256sum /tmp/NovelVoice-0.6.1-Lite-Aldo-CarlFM.apk

      - name: Upload APK
        id: apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelVoice-0.6.1-Lite-Aldo-CarlFM
          path: /tmp/NovelVoice-0.6.1-Lite-Aldo-CarlFM.apk
          compression-level: 0
          retention-days: 1

      - name: Record build result
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.apk_artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.apk_artifact.outputs.artifact-url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          mkdir -p tmp_build_nv061
          {
            echo "status=$JOB_STATUS"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "source_commit=$GITHUB_SHA"
            echo "source_sha256=fb507a0491305da2d4bb8315c5a81b3c30202335fe2342ac4ce1d2eb9173aa19"
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_url=$ARTIFACT_URL"
            if [ -f /tmp/NovelVoice-0.6.1-Lite-Aldo-CarlFM.apk ]; then
              echo "apk_sha256=$(sha256sum /tmp/NovelVoice-0.6.1-Lite-Aldo-CarlFM.apk | cut -d' ' -f1)"
              echo "apk_size=$(stat -c%s /tmp/NovelVoice-0.6.1-Lite-Aldo-CarlFM.apk)"
            fi
          } > tmp_build_nv061/build_result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_build_nv061/build_result.txt
          git commit -m "Record NovelVoice Lite build result [skip ci]" || true
          git push
